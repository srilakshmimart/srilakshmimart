<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sri Lakshmi Mart | Healthy · Homemade · Traditional · Organic</title>
  <meta name="description"
    content="Homemade organic malts, ready mixes, masalas and laddus from Uthangarai, Krishnagiri District. FSSAI certified, 100% natural, no preservatives. Order on WhatsApp.">
  <meta name="theme-color" content="#7A263A">
  <link rel="icon" href="assets/brand/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="canonical" href="https://srilakshmimart.com/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Sri Lakshmi Mart | Healthy · Homemade · Traditional · Organic">
  <meta property="og:description"
    content="Handcrafted organic malts, ready mixes, masalas and laddus. FSSAI certified. Made in Uthangarai, Tamil Nadu.">
  <meta property="og:image" content="assets/brand/logo-512.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/widgets.css">

  <script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"Store",
  "name":"Sri Lakshmi Mart",
  "description":"Homemade organic malts, ready mixes, masalas and laddus. FSSAI certified.",
  "telephone":"+91 73052 76415",
  "address":{"@type":"PostalAddress","addressLocality":"Uthangarai",
    "addressRegion":"Tamil Nadu","addressCountry":"IN"},
  "url":"https://srilakshmimart.com/"
}
</script>
</head>

<body>

  <a class="skip-link" href="#view">Skip to content</a>

  <!-- intro curtain -->
  <div id="curtain" aria-hidden="true">
    <div class="curtain-mark">
      <img class="cm-logo brand-plate" src="assets/brand/logo-256.png" alt="Sri Lakshmi Homemade Products" width="128"
        height="128">
      <div class="cm-name">SRI LAKSHMI MART</div>
      <div class="cm-rule"></div>
    </div>
  </div>

  <div class="app">

    <!-- desktop rail -->
    <aside class="rail" id="rail" aria-label="Store navigation"></aside>

    <!-- mobile bar -->
    <header class="mbar">
      <button class="icon-btn" data-act="menu" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <a class="mbar-brand" href="#/">
        <img class="brand-mark" src="assets/brand/mark-64.png" alt="Sri Lakshmi Homemade Products" width="34"
          height="34">
        <span>SRI LAKSHMI MART</span>
      </a>
      <button class="icon-btn" data-act="search" aria-label="Search"><i class="bi bi-search"></i></button>
      <button class="icon-btn" data-act="wishlist" aria-label="Open wishlist">
        <i class="bi bi-heart"></i><span class="badge" data-count="wish">0</span></button>
      <button class="icon-btn" data-act="cart" aria-label="Open cart">
        <i class="bi bi-bag"></i><span class="badge" data-count="cart">0</span>
      </button>
    </header>

    <!-- global action bar: present on every page, not just the hero -->
    <div class="utilbar" id="utilBar">
      <button class="hutil" data-act="search" aria-label="Search products">
        <i class="bi bi-search"></i></button>
      <button class="hutil" data-act="wishlist" aria-label="Open wishlist">
        <i class="bi bi-heart"></i><span class="hutil-badge" data-count="wish">0</span></button>
      <button class="hutil" data-act="cart" aria-label="Open cart">
        <i class="bi bi-bag"></i><span class="hutil-badge" data-count="cart">0</span></button>
      <!-- <button class="hutil" data-go="#/contact" aria-label="Contact us">
      <i class="bi bi-telephone"></i></button> -->
    </div>

    <div class="main">
      <div id="tickerHost"></div>

      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- mobile drawer -->
  <nav class="mdrawer" id="mdrawer" aria-label="Mobile navigation">
    <div class="mdrawer-head">
      <img class="brand-mark" src="assets/brand/logo-256.png" alt="Sri Lakshmi Homemade Products" width="38"
        height="38"><b>SRI LAKSHMI MART</b>
      <button class="icon-btn" data-act="close" aria-label="Close menu"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="mdrawer-body" id="mdrawerBody"></div>
    <div class="mdrawer-foot">
      <a class="btn btn-wa btn-block" target="_blank" rel="noopener"
        href="https://wa.me/917305276415?text=Hello%20Sri%20Lakshmi%20Mart!">
        <i class="bi bi-whatsapp"></i> +91 73052 76415</a>
    </div>
  </nav>

  <!-- cart drawer -->
  <aside class="rdrawer" id="cartDrawer" aria-label="Shopping cart">
    <div class="rd-head">
      <h3>Shopping Cart</h3>
      <button class="icon-btn" data-act="close" aria-label="Close cart"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="rd-body" id="cartBody"></div>
    <div class="rd-foot" id="cartFoot"></div>
  </aside>

  <!-- wishlist drawer -->
  <aside class="rdrawer" id="wishDrawer" aria-label="Wishlist">
    <div class="rd-head">
      <h3>Wishlist</h3>
      <button class="icon-btn" data-act="close" aria-label="Close wishlist"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="rd-body" id="wishBody"></div>
  </aside>

  <!-- search overlay -->
  <div class="search-ov" id="searchOv" role="dialog" aria-modal="true" aria-label="Search products">
    <div class="search-top">
      <div class="search-row">
        <i class="bi bi-search" style="font-size:1.3rem;color:var(--muted)"></i>
        <input id="searchInput" type="search" placeholder="What are you looking for?" aria-label="Search products"
          autocomplete="off">
        <button class="icon-btn" id="searchClear" aria-label="Clear search"><i class="bi bi-x-circle"></i></button>
        <button class="icon-btn" data-act="close" aria-label="Close search"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="search-hint">
        <span><kbd>↑</kbd><kbd>↓</kbd> to navigate</span>
        <span><kbd>Enter</kbd> to open</span>
        <span><kbd>Esc</kbd> to close</span>
      </div>
    </div>
    <div class="search-results">
      <div class="search-inner" id="searchInner"></div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- floating stack: assistant, back to top, WhatsApp -->


  <button class="float-btn to-top" id="toTop" aria-label="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <button class="float-btn ab-fab" id="abBtn" aria-label="Open the shopping assistant" aria-expanded="false"
    aria-controls="abPanel">
    <i class="bi bi-robot"></i>
  </button>

  <section class="ab-panel" id="abPanel" role="dialog" aria-modal="false" aria-label="Sri Lakshmi Assistant">

    <header class="ab-head">
      <div>
        <b>Sri Lakshmi Assistant</b>
        <span>How can we help you?</span>
      </div>
      <button class="icon-btn" id="abClose" aria-label="Close the assistant">
        <i class="bi bi-x-lg"></i></button>
    </header>

    <div class="ab-log" id="abLog" aria-live="polite"></div>
    <div class="ab-chips" id="abChips"></div>
    <div class="ab-input">
      <label class="sr-only" for="abInput">Ask a question</label>
      <input id="abInput" type="text" placeholder="Ask about a product or an order…" autocomplete="off">

      <button class="ab-send" id="abSend" aria-label="Send message">
        <i class="bi bi-send"></i></button>
    </div>
    
  </section>

  <a class="wa-float" href="https://wa.me/917305276415?text=Hello%20Sri%20Lakshmi%20Mart!" target="_blank"
    rel="noopener" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path
        d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.48-1.75-1.65-2.05-.17-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37s-1.04 1.01-1.04 2.48 1.06 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35M12.05 21.8h-.02a9.8 9.8 0 0 1-4.99-1.37l-.36-.21-3.71.97.99-3.62-.23-.37a9.78 9.78 0 0 1-1.5-5.23c0-5.4 4.4-9.8 9.82-9.8 2.62 0 5.08 1.03 6.93 2.88a9.74 9.74 0 0 1 2.87 6.93c0 5.4-4.4 9.8-9.8 9.8M20.52 3.45A11.7 11.7 0 0 0 12.05 0C5.6 0 .36 5.24.36 11.68c0 2.06.54 4.07 1.56 5.85L.26 24l6.62-1.74a11.65 11.65 0 0 0 5.17 1.24h.01c6.44 0 11.68-5.24 11.69-11.68a11.6 11.6 0 0 0-3.43-8.27" />
    </svg>
  </a>

  <div class="cursor" id="cur" aria-hidden="true"></div>
  <div class="cursor-ring" id="curRing" aria-hidden="true"><span>View</span></div>

  <style>
    kbd {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: .7rem;
      font-family: inherit;
      margin-right: 3px
    }
  </style>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/assistant-data.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/views.js"></script>
  <script>
    (function () {
      Shell.mount();
      Views.render();
      Widgets.mount();
      addEventListener('hashchange', Views.render);
      // lift the curtain once the first paint is done
      addEventListener('load', () => setTimeout(() => {
        document.getElementById('curtain').classList.add('done');
      }, 380));
      setTimeout(() => document.getElementById('curtain').classList.add('done'), 2200); // safety
    })();
  </script>
</body>

</html>
